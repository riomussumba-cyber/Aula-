<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d3fc0"><title>KidinglesP — English Learning</title>
<style>
:root{--bg:#f7f3ff;--card:#fff;--ink:#302640;--muted:#746d83;--p:#6d3fc0;--p2:#8b5bd6;--good:#35a66f;--bad:#df5d68;--soft:#eee6ff;--line:#e4dcef}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh}.hero{background:linear-gradient(145deg,#5530a5,#8b51d1);color:#fff;padding:28px 20px 24px;border-radius:0 0 34px 34px}.hero-top{display:flex;justify-content:space-between}.owl{font-size:52px}.lang{font-size:28px}.hero h1{font-size:32px;margin:8px 0 2px}.hero p{font-size:17px;margin:0 0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#ffffff22;border-radius:20px;padding:12px}.stat small,.stat strong{display:block}.stat strong{font-size:25px;margin-top:4px}nav{display:flex;gap:8px;overflow:auto;padding:14px;position:sticky;top:0;background:#f7f3ffdd;backdrop-filter:blur(8px);z-index:20}nav button,.back{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 13px;font-weight:700;white-space:nowrap}main{padding:8px 16px 100px}.section-title{margin:25px 0 8px}.section-title h2{font-size:25px;margin:0}.section-title p{margin:4px 0;color:var(--muted)}.lesson-list{display:grid;gap:12px}.lesson{background:#fff;border:2px solid var(--line);border-radius:22px;padding:15px;display:flex;align-items:center;gap:13px}.lesson.locked{opacity:.58}.lesson-icon{width:52px;height:52px;border-radius:17px;background:var(--soft);display:grid;place-items:center;font-size:28px}.lesson-info{flex:1}.lesson-info h3{margin:0 0 4px;font-size:18px}.lesson-info p{margin:0;color:var(--muted);font-size:13px}.lesson button,.primary{border:0;background:var(--p);color:#fff;border-radius:14px;padding:10px 13px;font-weight:800}.badge{font-size:11px;background:#e5f7ee;color:#217a50;border-radius:999px;padding:4px 8px;font-weight:700;display:inline-block;margin-top:6px}.panel{background:#fff;border:2px solid var(--line);border-radius:24px;padding:18px;margin-top:14px}.hidden{display:none!important}.lesson-head{display:flex;gap:12px;align-items:center;margin-top:14px}.lesson-head .big{font-size:40px}.lesson-head h2{margin:0}.lesson-head p{margin:3px 0;color:var(--muted)}.vocab{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.word-card{border:2px solid var(--line);border-radius:18px;padding:13px}.word-emoji{font-size:28px}.word-en{font-size:20px;font-weight:800}.word-pt{color:var(--muted);font-size:14px}.phon{display:inline-block;background:#fff4d8;color:#8a6819;border-radius:8px;padding:4px 7px;font-size:12px;margin-top:4px}.speak{border:0;background:var(--soft);color:var(--p);border-radius:50%;width:40px;height:40px;float:right}.example{background:#f8f5ff;border-left:5px solid var(--p);padding:12px;border-radius:12px;margin:8px 0}.example b{display:block}.translation{color:var(--muted);margin-top:4px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.actions button{flex:1;min-width:140px}.progressbar{height:10px;background:#e7dfef;border-radius:999px;overflow:hidden}.progressbar i{display:block;height:100%;background:var(--p);width:0}.quiz-q{font-size:20px;font-weight:800;margin:14px 0 8px}.quiz-pt{color:var(--muted);margin-bottom:14px}.answers{display:grid;gap:9px}.answer{border:2px solid var(--line);background:#fff;border-radius:15px;padding:12px;text-align:left;font-weight:700}.answer.correct{border-color:var(--good);background:#e9f8f0}.answer.wrong{border-color:var(--bad);background:#fff0f1}.feedback{margin-top:12px;font-weight:800}.scorebox{text-align:center;padding:20px}.score{font-size:44px;font-weight:900;color:var(--p)}.reading{font-size:17px;line-height:1.7}footer{padding:18px;text-align:center;color:var(--muted);font-size:12px}.toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,20px);background:#302640;color:#fff;border-radius:999px;padding:11px 17px;font-weight:800;opacity:0;transition:.25s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:760px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);z-index:30;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.bottom button{border:0;background:none;color:#777;font-weight:800;font-size:12px}.bottom span{display:block;font-size:23px}@media(max-width:520px){.vocab{grid-template-columns:1fr}.hero h1{font-size:29px}}
</style></head><body><div class="app">
<header class="hero"><div class="hero-top"><span class="owl">🦉</span><span class="lang">🇬🇧</span></div><h1>English Learning</h1><p>O teu curso de inglês</p><div class="stats"><div class="stat">⭐ <small>Pontos</small><strong id="points">0</strong></div><div class="stat">📚 <small>Lições</small><strong id="done">0</strong></div><div class="stat">🏆 <small>Nível</small><strong id="level">1</strong></div></div></header>
<nav><button onclick="home()">🗺️ Trilha</button><button onclick="reading(1)">📖 Leitura</button><button onclick="quizHub()">🧠 Quiz</button><button onclick="progress()">🏆 Progresso</button></nav>
<main><section id="home"><div class="section-title"><h2>🗺️ Trilha de aprendizagem</h2><p>Avança uma lição de cada vez.</p></div><div id="list" class="lesson-list"></div></section><section id="lesson" class="hidden"></section><section id="read" class="hidden"></section><section id="quiz" class="hidden"></section><section id="prog" class="hidden"></section></main><footer>KidinglesP • Inglês com tradução, pronúncia, leitura e quiz.</footer><div id="toast" class="toast"></div><div class="bottom"><button onclick="home()"><span>🗺️</span>Trilha</button><button onclick="reading(1)"><span>📖</span>Leitura</button><button onclick="quizHub()"><span>🧠</span>Quiz</button><button onclick="progress()"><span>🏆</span>Progresso</button></div></div>
<script>
const L=[
["👋","Primeiras palavras","First Words","Cumprimentos e palavras básicas.",[["👋","Hello","Olá","rê-lôu"],["🙋","Hi","Oi","rrái"],["👋","Goodbye","Adeus","gud-bái"],["🙏","Please","Por favor","plíz"],["😊","Thank you","Obrigado(a)","thénk iú"],["👍","Yes","Sim","iés"],["🙅","No","Não","nôu"],["🌙","Good night","Boa noite","gud náit"]],[["Hello! My name is Ana.","Olá! O meu nome é Ana."],["Thank you very much.","Muito obrigado(a)."]]],
["🧍","Human Body","Corpo Humano","Partes principais do corpo humano.",[["👤","Head","Cabeça","héd"],["💇","Hair","Cabelo","hér"],["👁️","Eye","Olho","ái"],["👂","Ear","Orelha","ír"],["👃","Nose","Nariz","nôuz"],["👄","Mouth","Boca","máuth"],["🖐️","Hand","Mão","hénd"],["🦶","Foot","Pé","fút"],["🦵","Leg","Perna","lég"],["💪","Arm","Braço","árm"]],[["This is my hand.","Esta é a minha mão."],["I have two eyes.","Eu tenho dois olhos."]]],
["👤","Personal Pronouns","Pronomes pessoais","I, you, he, she, it, we, they.",[["🙋","I","Eu","ái"],["👉","You","Tu / Você","iú"],["👨","He","Ele","rí"],["👩","She","Ela","xí"],["📦","It","Ele/Ela para coisas ou animais","it"],["👨‍👩‍👧","We","Nós","uí"],["👥","They","Eles / Elas","dêi"]],[["I am a student.","Eu sou estudante."],["She is my sister.","Ela é minha irmã."],["They are friends.","Eles são amigos."]]],
["⚙️","Auxiliary Verbs","Verbos auxiliares","Aprende a usar be, do e have.",[["🔵","Am","Sou / Estou","ém"],["🔵","Is","É / Está","iz"],["🔵","Are","São / Estão","ár"],["⚙️","Do","Fazer / auxiliar","dú"],["⚙️","Does","Faz / auxiliar","dâz"],["📦","Have","Ter","hév"],["📦","Has","Tem","ház"]],[["I am happy.","Eu estou feliz."],["Do you like English?","Você gosta de inglês?"],["She does not work here.","Ela não trabalha aqui."],["They have a house.","Eles têm uma casa."]]],
["📅","Months","Meses do ano","Os 12 meses em inglês.",[["1️⃣","January","Janeiro","djé-nu-éri"],["2️⃣","February","Fevereiro","féb-ru-éri"],["3️⃣","March","Março","mártch"],["4️⃣","April","Abril","êi-pril"],["5️⃣","May","Maio","mêi"],["6️⃣","June","Junho","djún"],["7️⃣","July","Julho","dju-lái"],["8️⃣","August","Agosto","ó-gâst"],["9️⃣","September","Setembro","sep-tém-bâr"],["🔟","October","Outubro","ok-tôu-bâr"],["1️⃣1️⃣","November","Novembro","nôu-vém-bâr"],["1️⃣2️⃣","December","Dezembro","di-sém-bâr"]],[["My birthday is in June.","O meu aniversário é em junho."],["December is the last month.","Dezembro é o último mês."]]],
["🏠","Objects at Home","Objetos da casa","Objetos comuns que encontramos em casa.",[["🚪","Door","Porta","dór"],["🪟","Window","Janela","uín-dou"],["🪑","Chair","Cadeira","tchér"],["🛋️","Sofa","Sofá","sôu-fâ"],["🛏️","Bed","Cama","béd"],["🪞","Mirror","Espelho","mí-râr"],["💡","Lamp","Lâmpada","lémp"],["🧹","Broom","Vassoura","brúm"],["📺","Television","Televisão","té-lâ-ví-jan"],["🗄️","Table","Mesa","têi-bâl"]],[["The door is open.","A porta está aberta."],["The lamp is on the table.","A lâmpada está sobre a mesa."]]],
["🍳","Kitchen","Cozinha","Objetos e utensílios da cozinha.",[["🍽️","Plate","Prato","plêit"],["🥄","Spoon","Colher","spún"],["🍴","Fork","Garfo","fórk"],["🔪","Knife","Faca","náif"],["🥤","Cup","Chávena / Copo","kâp"],["🥛","Glass","Copo","gláss"],["🍳","Pan","Frigideira","pén"],["🍲","Pot","Panela","pót"],["🧊","Fridge","Frigorífico","fridj"],["🔥","Oven","Forno","â-vân"]],[["The plate is on the table.","O prato está sobre a mesa."],["The food is in the fridge.","A comida está no frigorífico."]]],
["🚪","Rooms","Cômodos da casa","Os principais cômodos da casa.",[["🛋️","Living room","Sala de estar","lí-vin rúm"],["🛏️","Bedroom","Quarto","béd-rúm"],["🍳","Kitchen","Cozinha","kít-chen"],["🚿","Bathroom","Casa de banho","báth-rúm"],["🍽️","Dining room","Sala de jantar","dái-ning rúm"],["💼","Office","Escritório","ó-fis"],["🚗","Garage","Garagem","gâ-rádj"],["🌳","Garden","Jardim","gár-dân"]],[["The kitchen is clean.","A cozinha está limpa."],["My bedroom is small.","O meu quarto é pequeno."]]],
["👕","Clothes","Vestimentas","Roupas para homem e menina.",[["👕","Shirt","Camisa","chârt"],["👖","Trousers","Calças","tráu-zârz"],["👗","Dress","Vestido","drés"],["👚","Skirt","Saia","skârt"],["🩳","Shorts","Calções","chórts"],["🧥","Jacket","Casaco","djé-kât"],["👟","Shoes","Sapatos","xúz"],["🧢","Cap","Boné","kép"],["🧦","Socks","Meias","sóks"],["🧣","Scarf","Cachecol","skárf"]],[["He is wearing a shirt.","Ele está a vestir uma camisa."],["She is wearing a dress.","Ela está a vestir um vestido."]]],
["👤","Possessive Pronouns","Pronomes possessivos","my, your, his, her, its, our, their.",[["🙋","My","Meu / Minha","mái"],["👉","Your","Teu / Seu","iór"],["👨","His","Dele","hiz"],["👩","Her","Dela","hâr"],["📦","Its","Dele/Dela para coisa ou animal","its"],["👨‍👩‍👧","Our","Nosso / Nossa","áuâr"],["👥","Their","Deles / Delas","dér"]],[["This is my book.","Este é o meu livro."],["That is her dress.","Aquele é o vestido dela."],["Our house is big.","A nossa casa é grande."],["Their car is new.","O carro deles é novo."]]]
];
const Q=[
["How do you say 'Olá' in English?","Como se diz 'Olá' em inglês?",["Hello","Goodbye","Please"],0],
["What is 'Eye'?","O que significa 'Eye'?",["Ouvido","Olho","Nariz"],1],
["Which pronoun means 'Ela'?","Qual pronome significa 'Ela'?",["He","She","They"],1],
["Choose the correct sentence.","Escolhe a frase correta.",["I am happy.","I is happy.","I are happy."],0],
["Which month means 'Janeiro'?","Qual mês significa 'Janeiro'?",["June","January","July"],1],
["What is 'Door'?","O que significa 'Door'?",["Porta","Janela","Mesa"],0],
["What is 'Spoon'?","O que significa 'Spoon'?",["Garfo","Faca","Colher"],2],
["Which word means 'Quarto'?","Qual palavra significa 'Quarto'?",["Kitchen","Bedroom","Garden"],1],
["What is 'Dress'?","O que significa 'Dress'?",["Vestido","Sapatos","Boné"],0],
["Which word means 'Nosso/Nossa'?","Qual palavra significa 'Nosso/Nossa'?",["Their","Her","Our"],2]
];
let S=JSON.parse(localStorage.getItem('kidinglesp_state')||'null')||{points:0,done:[],scores:{}};let qi=0,qs=0,qlesson=1,answered=false;
const $=id=>document.getElementById(id);function save(){localStorage.setItem('kidinglesp_state',JSON.stringify(S));stats()}function stats(){$('points').textContent=S.points;$('done').textContent=S.done.length;$('level').textContent=Math.max(1,Math.floor(S.points/100)+1)}function toast(t){let x=$('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1000)}function speak(t){if(!('speechSynthesis'in window)){toast('Voz não suportada neste navegador.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}function hide(){['home','lesson','read','quiz','prog'].forEach(x=>$(x).classList.add('hidden'))}
function home(){hide();$('home').classList.remove('hidden');let b=$('list');b.innerHTML='';L.forEach((l,i)=>{let ok=i===0||S.done.includes(i),done=S.done.includes(i);b.innerHTML+=`<div class="lesson ${ok?'':'locked'}"><div class="lesson-icon">${l[0]}</div><div class="lesson-info"><h3>${i+1}. ${l[1]}</h3><p>${l[2]} • ${l[3]}</p><span class="badge">${done?'✅ Concluída':ok?'🔓 Disponível':'🔒 Conclui a anterior'}</span></div><button ${ok?'':'disabled'} onclick="lesson(${i})">${done?'Rever':'Abrir'}</button></div>`});scrollTo(0,0)}
function lesson(i){if(i>0&&!S.done.includes(i-1)){toast('Conclui a lição anterior primeiro.');return}hide();$('lesson').classList.remove('hidden');let l=L[i];$('lesson').innerHTML=`<div class="panel"><button class="back" onclick="home()">← Voltar à trilha</button><div class="lesson-head"><span class="big">${l[0]}</span><div><h2>${i+1}. ${l[1]}</h2><p>${l[2]}</p></div></div><div class="vocab">${l[4].map(w=>`<div class="word-card"><button class="speak" onclick='speak(${JSON.stringify(w[1])})'>🔊</button><div class="word-emoji">${w[0]}</div><div class="word-en">${w[1]}</div><div class="word-pt">${w[2]}</div><span class="phon">${w[3]}</span></div>`).join('')}</div><h3>📖 Exemplos</h3>${l[5].map(e=>`<div class="example"><b>${e[0]} <button class="speak" onclick='speak(${JSON.stringify(e[0])})'>🔊</button></b><div class="translation">${e[1]}</div></div>`).join('')}<div class="actions"><button class="primary" onclick="startQuiz(${i})">🧠 Fazer quiz</button><button class="back" onclick="reading(${i})">📖 Leitura</button></div></div>`;scrollTo(0,0)}
function reading(i=0){hide();$('read').classList.remove('hidden');let l=L[i];$('read').innerHTML=`<div class="panel"><button class="back" onclick="lesson(${i})">← Voltar</button><h2>📖 Leitura — ${l[1]}</h2><p>Inglês + tradução</p><div class="reading">${l[5].map(e=>`<div class="example"><b>${e[0]}</b><div class="translation">${e[1]}</div></div>`).join('')}</div><div class="actions"><button class="primary" onclick='speak(${JSON.stringify(l[5].map(e=>e[0]).join('. '))})'>🔊 Ouvir leitura</button><button class="back" onclick="startQuiz(${i})">🧠 Quiz</button></div></div>`;scrollTo(0,0)}
function startQuiz(i){qlesson=i;qi=0;qs=0;renderQ();hide();$('quiz').classList.remove('hidden');scrollTo(0,0)}function renderQ(){let q=Q[qlesson];$('quiz').innerHTML=`<div class="panel"><button class="back" onclick="lesson(${qlesson})">← Lição</button><h2>🧠 Quiz — Lição ${qlesson+1}</h2><div class="progressbar"><i style="width:${qi/3*100}%"></i></div><div class="quiz-q">${q[0]} <button class="speak" onclick='speak(${JSON.stringify(q[0])})'>🔊</button></div><div class="quiz-pt">🇵🇹 ${q[1]}</div><div class="answers">${q[2].map((o,j)=>`<button class="answer" onclick="answer(${j})">${String.fromCharCode(65+j)}) ${o}</button>`).join('')}</div><div id="fb" class="feedback"></div></div>`;answered=false}function answer(i){if(answered)return;answered=true;let q=Q[qlesson],a=document.querySelectorAll('.answer');a[q[3]].classList.add('correct');if(i===q[3]){qs++;S.points+=10;$('fb').textContent='✅ Correto! +10 pontos';toast('Excelente! 🌟')}else{a[i].classList.add('wrong');$('fb').textContent='❌ A resposta certa está marcada.'}save();setTimeout(()=>{qi++;qi<3?renderQ():finish()},700)}
function finish(){let pct=Math.round(qs/3*100);S.scores[qlesson]=Math.max(S.scores[qlesson]||0,pct);if(pct>=67&&!S.done.includes(qlesson)){S.done.push(qlesson);S.points+=30}save();$('quiz').innerHTML=`<div class="panel scorebox"><h2>🏆 Resultado</h2><div class="score">${pct}/100</div><p>${qs}/3 respostas corretas</p><p>${pct>=67?'🎉 Lição concluída! Próxima desbloqueada.':'💪 Pratica mais e tenta novamente.'}</p><div class="actions"><button class="primary" onclick="startQuiz(${qlesson})">🔄 Refazer</button><button class="back" onclick="home()">🗺️ Trilha</button>${pct>=67&&qlesson<9?`<button class="primary" onclick="lesson(${qlesson+1})">Próxima →</button>`:''}</div></div>`;scrollTo(0,0)}
function quizHub(){startQuiz(Math.min(9,S.done.length))}function progress(){hide();$('prog').classList.remove('hidden');let sc=Object.values(S.scores),avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):0;$('prog').innerHTML=`<div class="panel"><h2>🏆 Progresso</h2><div class="scorebox"><div class="score">${S.points}</div><p>Pontos</p><div class="progressbar"><i style="width:${S.done.length/10*100}%"></i></div><p><b>${S.done.length}/10</b> lições concluídas</p><p>Média dos quizzes: <b>${avg}/100</b></p></div><h3>📚 Lições</h3>${L.map((l,i)=>`<div class="example"><b>${l[0]} ${i+1}. ${l[1]}</b><span style="float:right">${S.done.includes(i)?'✅':'🔒'}</span></div>`).join('')}<button class="back" onclick="resetProgress()">♻️ Reiniciar progresso</button></div>`;scrollTo(0,0)}function resetProgress(){if(confirm('Apagar todo o progresso?')){S={points:0,done:[],scores:{}};save();home()}}stats();home();
</script></body></html>
